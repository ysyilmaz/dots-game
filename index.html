<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dots — Kuşatmaca</title>
<meta name="description" content="İki kişilik kuşatmaca (dots) oyunu — aynı cihazda, bota karşı veya oda kodu ile online.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='11' cy='11' r='6' fill='%23c8102e'/><circle cx='21' cy='21' r='6' fill='%231c5fbe'/></svg>">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
</head>
<body>

<header class="bar">
  <h1>Dots <span>Kuşatmaca</span></h1>

  <div class="scores">
    <div class="side red" id="sideRed">
      <span class="dot"></span>
      <span class="nm" id="nameRed">Kırmızı</span>
      <span class="val" id="scoreRed">0</span>
    </div>
    <div class="side blue" id="sideBlue">
      <span class="dot"></span>
      <span class="nm" id="nameBlue">Mavi</span>
      <span class="val" id="scoreBlue">0</span>
    </div>
  </div>

  <div class="actions">
    <button id="btnPass" type="button">Pas</button>
    <button id="btnUndo" type="button">Geri al</button>
    <button id="btnResign" type="button">Pes et</button>
    <button id="btnSetup" type="button" class="primary">Yeni oyun</button>
  </div>
</header>

<div class="statusbar">
  <p id="status">—</p>
  <div class="zoom">
    <button id="btnZoomOut" type="button" aria-label="Küçült">−</button>
    <button id="btnZoomFit" type="button">Sığdır</button>
    <button id="btnZoomIn" type="button" aria-label="Büyüt">+</button>
  </div>
</div>

<main class="board-wrap" id="boardWrap">
  <canvas id="board"></canvas>
</main>

<div class="overlay hidden" id="overlay">
  <section class="panel" id="setup">
    <button class="close" id="btnCloseSetup" type="button" aria-label="Kapat">×</button>
    <h2>Yeni oyun</h2>

    <div class="field">
      <span class="label">Oyun türü</span>
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="local" class="on">Aynı cihazda</button>
        <button type="button" data-mode="bot">Bota karşı</button>
        <button type="button" data-mode="online">Online</button>
      </div>
    </div>

    <div class="field" id="sizeField">
      <span class="label">Tahta</span>
      <div class="seg" id="sizeSeg">
        <button type="button" data-w="15" data-h="15">15×15</button>
        <button type="button" data-w="25" data-h="25">25×25</button>
        <button type="button" data-w="39" data-h="32" class="on">39×32</button>
        <button type="button" data-w="55" data-h="45">55×45</button>
      </div>
      <div class="custom">
        <label>Genişlik <input type="number" id="inpW" min="5" max="120" value="39"></label>
        <label>Yükseklik <input type="number" id="inpH" min="5" max="120" value="32"></label>
        <span class="hint">5–120 arası serbest</span>
      </div>
    </div>

    <div class="field hidden" id="onlineField">
      <span class="label">Online</span>
      <div class="online-row">
        <button type="button" id="btnHost" class="primary">Oda kur</button>
        <span class="sep">veya</span>
        <input type="text" id="inpRoom" placeholder="ODA KODU" maxlength="6" autocomplete="off" spellcheck="false">
        <button type="button" id="btnJoin">Katıl</button>
      </div>
      <div class="room hidden" id="roomBox">
        <div class="code" id="roomCode">------</div>
        <div class="share">
          <input type="text" id="shareLink" readonly>
          <button type="button" id="btnCopy">Kopyala</button>
        </div>
        <p class="hint" id="roomHint">Bu linki arkadaşına gönder.</p>
        <div class="room-actions hidden" id="roomActions">
          <button type="button" id="btnRestart">Aynı odada yeniden başlat</button>
          <button type="button" id="btnLeave">Odadan çık</button>
        </div>
      </div>
    </div>

    <div class="foot">
      <button type="button" id="btnStart" class="primary big">Başlat</button>
      <p class="rules-hint">Sırayla kesişimlere nokta koyarsın. Rakip noktalarını kendi noktalarınla çevirirsen o alan senin olur.</p>
    </div>
  </section>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
